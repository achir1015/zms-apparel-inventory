[project]
name = "zms-inventory"
version = "0.6.1"
description = "資料助秘工具之服飾業進銷存系統"
authors = [{ name = "吳玉柱", email = "achir1015@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["flet==1.1.2", "pymysql>=1.1"]

[tool.flet]
org = "com.achir"
product = "資料助秘服飾業進銷存"
company = "吳玉柱"
copyright = "© 2026 吳玉柱"

[tool.flet.app]
path = "."
exclude = ["tests", "tools", "packaging", "data", "data_mobile", ".venv", "dist", "build", "dist-installer",
           "build-mac", "dist-mac", "run_web.py", "run_web_mobile.py", "*.bat"]

[tool.flet.ios]
bundle_id = "com.achir.zmsinventory"
team_id = "7BN6XJ59KP"
export_method = "ad-hoc"

[tool.flet.ios.info]
NSLocalNetworkUsageDescription = "連到同一個 Wi-Fi 內電腦上的進銷存資料庫"
UISupportedInterfaceOrientations = ["UIInterfaceOrientationPortrait"]
ITSAppUsesNonExemptEncryption = false
